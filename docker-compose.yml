services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    container_name: pera-pera-cafe-nest
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/pera_pera_cafe?schema=public
      COOKIE_SECURE: 'false'
    volumes:
      - .:/app
      # Keep the image's Linux install; the host one has macOS binaries.
      - /app/node_modules

networks:
  default:
    external: true
    name: postgres-17_default